name: Deploy Evidence Dashboard

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # actions/checkout@v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # pnpm/action-setup@v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: results_analysis/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: results_analysis
        run: pnpm install --frozen-lockfile

      - name: Load sources
        working-directory: results_analysis
        run: pnpm run sources

      - name: Build dashboard
        working-directory: results_analysis
        run: pnpm run build

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: results_analysis/build
